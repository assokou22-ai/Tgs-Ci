    <style>
      :root {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-feature-settings: "cv02", "cv03", "cv04", "cv11";
      }

      body {
        background-color: #07080a;
        color: #f1f2f6;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        padding-top: env(safe-area-inset-top, 0px);
        padding-left: env(safe-area-inset-left, 0px);
        padding-right: env(safe-area-inset-right, 0px);
      }

      /* Inertial scrolling for touch viewports */
      * {
        -webkit-overflow-scrolling: touch;
      }

      /* ================= v1.2.0 : INTERFACE ADAPTATIVE (3" → 13") ================= */
      /* Taille de base fluide : tout ce qui est en rem (textes, marges, icônes Tailwind)
         se réduit proportionnellement sur les petits téléphones. */
      html { font-size: 16px; }
      html.device-mobile { font-size: clamp(13px, calc(9px + 1.4vw), 15.5px); }
      html.device-mobile.screen-xs { font-size: 12.5px; }
      html.device-tablet { font-size: 15.5px; }

      html.device-touch { touch-action: manipulation; }

      /* Zones tactiles confortables sans « gros boutons » */
      html.device-tablet button,
      html.device-tablet [role="button"] { min-height: 2.5rem; touch-action: manipulation; }
      html.device-mobile button,
      html.device-mobile [role="button"] { min-height: 2.25rem; touch-action: manipulation; }
      html.device-mobile .no-min-h, html.device-tablet .no-min-h { min-height: 0 !important; }

      html.device-touch input:not([type="checkbox"]):not([type="radio"]):not([type="range"]),
      html.device-touch select,
      html.device-touch textarea { min-height: 2.5rem; font-size: max(0.95rem, 14px); }
      /* iPhone/iPad : 16px minimum, sinon Safari zoome à la saisie */
      html.ios input:not([type="checkbox"]):not([type="radio"]):not([type="range"]),
      html.ios select,
      html.ios textarea { font-size: 16px !important; }

      html.device-touch input[type="checkbox"],
      html.device-touch input[type="radio"] { min-width: 18px; min-height: 18px; cursor: pointer; }

      html.device-touch button:active,
      html.device-touch [role="button"]:active { transform: scale(0.97); transition: transform 0.08s ease; }

      html.device-mobile .apple-card { padding: 0.875rem !important; border-radius: 16px; }
      html.device-tablet .apple-card { padding: 1.25rem !important; }

      /* Petits écrans : titres et grandes marges ramenés à l'échelle */
      html.device-mobile .text-4xl { font-size: 1.75rem; line-height: 2.1rem; }
      html.device-mobile .text-3xl { font-size: 1.5rem; line-height: 1.9rem; }
      html.device-mobile .text-2xl { font-size: 1.3rem; line-height: 1.7rem; }
      html.device-mobile .p-8 { padding: 1.25rem; }
      html.device-mobile .p-10 { padding: 1.5rem; }
      html.device-mobile .rounded-\[32px\] { border-radius: 22px; }

      /* Fluidité Android : les flous d'arrière-plan coûtent cher au GPU des téléphones */
      html.android-app .backdrop-blur-xl, html.android-app .backdrop-blur-2xl, html.android-app .backdrop-blur-3xl,
      html.android-app .backdrop-blur-lg, html.android-app .backdrop-blur-md, html.android-app .glass {
        -webkit-backdrop-filter: none !important; backdrop-filter: none !important;
      }
      html.android-app .glass { background: rgba(20, 22, 28, 0.97); }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      }

      /* Fond d'écran moderne (léger, sans image) */
      .app-bg, body {
        background-color: #07080b;
        background-image:
          radial-gradient(1200px 600px at 110% -10%, rgba(0, 113, 227, 0.16), transparent 60%),
          radial-gradient(900px 500px at -20% 110%, rgba(124, 58, 237, 0.12), transparent 60%),
          linear-gradient(180deg, #0a0c11 0%, #07080b 100%);
        background-attachment: fixed;
      }
      html.android-app .app-bg, html.android-app body { background-attachment: scroll; }

      /* Barre d'onglets mobile */
      .tabbar {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 70;
        padding: 0.35rem 0.5rem calc(env(safe-area-inset-bottom, 0px) + 0.35rem);
        background: rgba(12, 14, 19, 0.94);
        border-top: 1px solid rgba(255,255,255,0.07);
        -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
      }
      html.android-app .tabbar { background: rgba(12, 14, 19, 0.985); }
      .tabbar-btn { min-height: 0 !important; }
      .sheet-enter { animation: sheetUp 0.22s cubic-bezier(0.2, 0.8, 0.2, 1); }
      @keyframes sheetUp { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }

      /* STRUCTURE A4 UNIFIÉE (ÉCRAN & PRINT) */
      .printable-page {
        width: 210mm !important;
        min-height: 297mm !important;
        padding: 8mm 10mm;
        margin: 0 !important;
        box-sizing: border-box !important;
        background: #ffffff !important;
        color: #000000 !important;
        position: relative !important;
        display: flex !important;
        flex-direction: column !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        page-break-after: always !important;
        break-after: page !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
        letter-spacing: 0.02em !important;
        word-spacing: normal !important;
      }

      .printable-page:last-child {
        page-break-after: auto !important;
        break-after: auto !important;
      }

      .printable-page * {
        letter-spacing: 0.02em !important;
        box-sizing: border-box;
      }

      /* STRUCTURE SPÉCIFIQUE FICHE MONO-PAGE (DÉPÔT, RAPPORT TECHNIQUE, ETC.) : STRICTEMENT 1 SEULE PAGE A4 */
      .printable-page.ticket-single-page,
      .printable-page.single-page-fit {
        height: 296mm !important;
        max-height: 296mm !important;
        min-height: 296mm !important;
        overflow: hidden !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        page-break-after: always !important;
        break-after: page !important;
      }

      .printable-page.ticket-single-page:last-child,
      .printable-page.single-page-fit:last-child {
        page-break-after: auto !important;
        break-after: auto !important;
      }

      @media print {
        @page {
          size: A4 portrait;
          margin: 0 !important;
        }
        
        html, body {
          width: 210mm !important;
          min-height: 297mm !important;
          margin: 0 !important;
          padding: 0 !important;
          background: #ffffff !important;
        }

        #root, .no-print {
          display: none !important;
        }

        .printable-page {
          border: none !important;
          box-shadow: none !important;
          page-break-inside: avoid !important;
          break-inside: avoid !important;
          page-break-after: always !important;
          break-after: page !important;
        }

        .printable-page:last-child {
          page-break-after: auto !important;
          break-after: auto !important;
        }

        .printable-page.ticket-single-page,
        .printable-page.single-page-fit {
          height: 296mm !important;
          max-height: 296mm !important;
          min-height: 296mm !important;
          overflow: hidden !important;
          page-break-inside: avoid !important;
          break-inside: avoid !important;
          page-break-after: always !important;
          break-after: page !important;
        }

        .printable-page.ticket-single-page:last-child,
        .printable-page.single-page-fit:last-child {
          page-break-after: auto !important;
          break-after: auto !important;
        }

        /* Fix Firefox/Safari: s'assurer que les fonds s'impriment */
        * {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
      }

      /* Utilitaires UI */
      .glass {
        background: rgba(28, 28, 30, 0.85);
        backdrop-filter: blur(25px) saturate(200%);
        -webkit-backdrop-filter: blur(25px) saturate(200%);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .apple-card {
        background: #1c1c1e;
        border: 1px solid #3a3a3c;
        border-radius: 20px;
        transition: transform 0.2s ease;
      }

      /* BARRES DE DÉFILEMENT UNIFIÉES ET VISIBLES (UX CROSS-DEVICE) */
      .custom-scrollbar::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      
      .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.02);
        border-radius: 10px;
      }
      
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #4a4a4c;
        border: 2px solid transparent;
        background-clip: padding-box;
        border-radius: 10px;
      }

      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #0071e3;
        border: 2px solid transparent;
        background-clip: padding-box;
      }

      /* Pour Firefox */
      .custom-scrollbar {
        scrollbar-width: thin;
        scrollbar-color: #4a4a4c rgba(255, 255, 255, 0.02);
      }
      
      .btn-apple-primary {
        background: #0071e3;
        color: white;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* Effet d'ombre de scroll horizontal */
      .scroll-shadow-right {
        background: linear-gradient(to right, rgba(0,0,0,0), rgba(0,0,0,0.5));
        pointer-events: none;
      }
    </style>
