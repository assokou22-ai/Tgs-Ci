      /* STRUCTURE A4 UNIFIÉE (ÉCRAN & PRINT) */
      .printable-page {

        word-spacing: normal !important;

      .printable-page:last-child {
        page-break-after: auto !important;
        break-after: auto !important;

        box-sizing: border-box;

        height: 296mm !important;
        max-height: 296mm !important;
        min-height: 296mm !important;
        overflow: hidden !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        page-break-after: always !important;
        break-after: page !important;
      }

      .printable-page.ticket-single-page:last-child,
      .printable-page.single-page-fit:last-child {
        page-break-after: auto !important;
        break-after: auto !important;
      }

      @media print {
        @page {
          size: A4 portrait;
          margin: 0 !important;
        }
        
        html, body {
          width: 210mm !important;
          min-height: 297mm !important;
          margin: 0 !important;
          padding: 0 !important;
          background: #ffffff !important;
        }

        #root, .no-print {
          display: none !important;
        }

        .printable-page {
          border: none !important;
          box-shadow: none !important;
          page-break-inside: avoid !important;
          break-inside: avoid !important;
          page-break-after: always !important;
          break-after: page !important;
        }

        .printable-page:last-child {
          page-break-after: auto !important;
          break-after: auto !important;
        }

        .printable-page.ticket-single-page,
        .printable-page.single-page-fit {
          height: 296mm !important;
          max-height: 296mm !important;
          min-height: 296mm !important;
          overflow: hidden !important;
          page-break-inside: avoid !important;
          break-inside: avoid !important;
          page-break-after: always !important;
          break-after: page !important;
        }

        .printable-page.ticket-single-page:last-child,
        .printable-page.single-page-fit:last-child {
          page-break-after: auto !important;
          break-after: auto !important;
        }

        /* Fix Firefox/Safari: s'assurer que les fonds s'impriment */
        * {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
      }

      /* Utilitaires UI */
      .glass {
        background: rgba(28, 28, 30, 0.85);
        backdrop-filter: blur(25px) saturate(200%);

      }

      .apple-card {
        background: #1c1c1e;
        border: 1px solid #3a3a3c;
        border-radius: 20px;
        transition: transform 0.2s ease;
      }

      /* BARRES DE DÉFILEMENT UNIFIÉES ET VISIBLES (UX CROSS-DEVICE) */
      .custom-scrollbar::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      
      .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.02);
        border-radius: 10px;
      }
      
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #4a4a4c;
        border: 2px solid transparent;
        background-clip: padding-box;
        border-radius: 10px;
      }

      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #0071e3;
        border: 2px solid transparent;
        background-clip: padding-box;
      }

      /* Pour Firefox */
      .custom-scrollbar {
        scrollbar-width: thin;
        scrollbar-color: #4a4a4c rgba(255, 255, 255, 0.02);
      }
      
      .btn-apple-primary {
